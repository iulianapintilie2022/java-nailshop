
<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="siteHeader" class="site-header">

    <a th:href="@{/}" class="site-logo">
        the nailshop
    </a>

    <nav class="main-navigation" aria-label="Hauptnavigation">
        <a th:href="@{/products}">Shop</a>
        <a th:href="@{/#categories}">Kategorien</a>
    </nav>

    <div class="header-actions">

        <div class="language-switch" role="group" aria-label="Seitensprache">
            <button type="button" lang="en" disabled title="Englisch folgt später">EN</button>
            <span class="language-active" lang="de" aria-label="Deutsch, aktuelle Sprache">DE</span>
        </div>

        <!--account redirect -->
        <a th:href="@{/account-link}"
           class="header-icon"
           aria-label="Mein Konto"
           title="Mein Konto">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
            </svg>
        </a>

        <!-- Existing cart page -->
        <a th:href="@{/cart}"
           class="header-icon"
           aria-label="Warenkorb"
           title="Warenkorb">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
            </svg>
        </a>

    </div>

</header>

</body>
</html>
