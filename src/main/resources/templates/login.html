
<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden | the nailshop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>
    <div class="page-shell">
        <header th:replace="~{fragments/header :: siteHeader}"></header>
    <main id="main-content" class="login-main">
        <section class="login-card" aria-labelledby="login-title">
        <div class="login-heading">
            <h1 id="login-title">Willkommen zurück!</h1>
            <p>Melde dich bei deinem nailshop-Konto an.</p>
        </div>

        <!-- Display an error if login fails -->
        <p th:if="${param.error}" class="login-message login-error" role="alert">
            Ungültige E-Mail-Adresse oder ungültiges Passwort.
        </p>

        <!-- Display a message after logout -->
        <p th:if="${param.logout}" class="login-message login-success" role="status">
            Du wurdest erfolgreich abgemeldet.
        </p>

        <!-- Spring Security login form -->
        <form class="login-form" th:action="@{/login}" method="post">

            <div>
                <label for="username">E-Mail-Adresse</label>
                <input
                    type="email"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="E-Mail-Adresse eingeben"
                    required>
            </div>

            <div>
                <label for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Passwort eingeben"
                    required>
            </div>

            <button class="button" type="submit">Anmelden</button>

        </form>

        <!-- Registration link -->
        <p class="register-link">
            Neu bei the nailshop?
            <a th:href="@{/register}">
                Hier registrieren
            </a>
        </p>

        </section>
    </main>
    </div>

</body>
</html>
