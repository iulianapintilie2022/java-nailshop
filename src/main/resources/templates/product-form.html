<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.id == null ? 'Produkt hinzufügen | the nailshop' : 'Produkt bearbeiten | the nailshop'}">Produkt hinzufügen | the nailshop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/admin-products.css}">
</head>
<body>
    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>
    <div class="page-shell">
        <header th:replace="~{fragments/header :: siteHeader}"></header>
        <main id="main-content" class="product-form-page">
            <section class="product-editor" aria-labelledby="product-form-title">
                <h1 id="product-form-title" th:text="${product.id == null ? 'Produkt hinzufügen' : 'Produkt bearbeiten'}">Produkt hinzufügen</h1>
                <p th:if="${error}" th:text="${error}" class="product-validation-error" role="alert"></p>
                <form class="admin-product-form" th:action="@{/admin/products}" th:object="${product}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">
                    <div class="admin-form-field">
                        <label for="name">Name *</label>
                        <input type="text" th:field="*{name}" required pattern=".*\S.*" title="Bitte einen Produktnamen eingeben, nicht nur Leerzeichen.">
                    </div>
                    <div class="admin-form-field">
                        <label for="description">Beschreibung</label>
                        <textarea th:field="*{description}" rows="4"></textarea>
                    </div>
                    <div class="admin-form-field">
                        <label for="price">Preis (€) *</label>
                        <input type="number" step="0.01" min="0" th:field="*{price}" required>
                    </div>
                    <div class="admin-form-field">
                        <label for="stock">Bestand *</label>
                        <input type="number" min="0" step="1" th:field="*{stock}" required>
                    </div>
                    <div class="admin-form-field">
                        <label for="imageFile">Bild</label>
                        <input type="file" id="imageFile" name="imageFile" accept="image/*">
                    </div>
                    <div class="admin-form-field">
                        <label for="category">Kategorie</label>
                        <select th:field="*{category}">
                            <option value="">Keine Kategorie</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Kategorie</option>
                        </select>
                    </div>
                    <div class="product-form-actions">
                        <a class="admin-edit editor-cancel" th:href="@{/admin/products}">Abbrechen</a>
                        <button class="button admin-primary" type="submit">Produkt speichern</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
