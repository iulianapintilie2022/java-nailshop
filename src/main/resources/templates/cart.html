<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warenkorb | the nailshop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>
    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>
    <div class="page-shell">
        <header th:replace="~{fragments/header :: siteHeader}"></header>
        <main id="main-content" class="cart-main">
            <h1>Dein Warenkorb</h1>
            <p th:if="${error}" th:text="${error}" class="cart-error-message" role="alert"></p>
            <div class="cart-layout">
                <section class="cart-items" aria-label="Artikel im Warenkorb">
                    <p th:if="${items.isEmpty()}" class="cart-empty">Dein Warenkorb ist leer.</p>
                    <article class="cart-item" th:each="item : ${items}">
                        <img class="cart-product-image" th:src="${item.product.imageUrl}" th:alt="${item.product.name}">
                        <div class="cart-product-info">
                            <h2 th:text="${item.product.name}">Produktname</h2>
                            <p class="cart-unit-price">Preis: <span th:text="${'€' + item.product.discountedPrice}">€0.00</span></p>
                            <p class="cart-item-subtotal">Zwischensumme: <span th:text="${'€' + #numbers.formatDecimal(item.subtotal, 1, 2)}">€0.00</span></p>
                        </div>
                        <form class="cart-quantity-form" th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post">
                            <span class="quantity-label">Menge</span>
                            <div class="quantity-control">
                                <button type="submit" name="quantity" th:value="${item.quantity - 1}"
                                        th:aria-label="${'Menge verringern: ' + item.product.name}">−</button>
                                <span class="cart-quantity" th:text="${item.quantity}">1</span>
                                <button type="submit" name="quantity" th:value="${item.quantity + 1}"
                                        th:aria-label="${'Menge erhöhen: ' + item.product.name}">+</button>
                            </div>
                        </form>
                        <form class="cart-remove-form" th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                            <button class="cart-remove-button" type="submit" th:aria-label="${'Entfernen: ' + item.product.name}" title="Entfernen">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></svg>
                            </button>
                        </form>
                    </article>
                </section>
                <aside class="cart-summary" aria-labelledby="summary-title"
                       th:with="itemCount=${items.isEmpty() ? 0 : #aggregates.sum(items.![quantity])}">
                    <h2 id="summary-title">Bestellübersicht</h2>
                    <div class="summary-subtotal">
                        <span th:text="${'Zwischensumme (' + itemCount + ' Artikel)'}">Zwischensumme (0 Artikel)</span>
                        <span th:text="${'€' + #numbers.formatDecimal(total, 1, 2)}">€0.00</span>
                    </div>
                    <div class="summary-total">
                        <span>Gesamt</span>
                        <span th:text="${'€' + #numbers.formatDecimal(total, 1, 2)}">€0.00</span>
                    </div>
                    <a class="button checkout-button" th:href="@{/checkout}">Zur Kasse</a>
                </aside>
            </div>
            <a class="continue-shopping" th:href="@{/products}"><span aria-hidden="true">←</span> Weiter einkaufen</a>
        </main>
    </div>
</body>
</html>
