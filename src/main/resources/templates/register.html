<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konto erstellen | the nailshop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>
    <div class="page-shell">
        <header th:replace="~{fragments/header :: siteHeader}"></header>
        <main id="main-content" class="login-main">
            <section class="login-card" aria-labelledby="register-title">
                <div class="login-heading">
                    <h1 id="register-title">Konto erstellen</h1>
                </div>
    
    <p th:if="${error}"
    th:text="${error}" class="login-message login-error" role="alert">
    </p>

    <form class="login-form" th:action="@{/register}"
          th:object="${customer}"
          method="post">

        <div>
            <label for="firstName">Vorname:</label>
            <input type="text"
                   th:field="*{firstName}"
                   autocomplete="given-name"
                   required>
        </div>

        <div>
            <label for="lastName">Nachname:</label>
            <input type="text"
                   th:field="*{lastName}"
                   autocomplete="family-name"
                   required>
        </div>

        <div>
            <label for="email">E-Mail-Adresse:</label>
            <input type="email"
                th:field="*{email}"
                pattern="[^@\s]+@[^@\s]+\.[A-Za-z]{2,}"
                title="Bitte eine vollständige E-Mail-Adresse eingeben, z. B. name@example.com"
                autocomplete="email"
                required>
        </div>

        <div>
            <label for="password">Passwort:</label>
            <input type="password"
                   th:field="*{password}"
                   autocomplete="new-password"
                   required>
        </div>

        <button class="button" type="submit">
            Konto erstellen
        </button>

    </form>
            </section>
        </main>
    </div>

</body>
</html>
